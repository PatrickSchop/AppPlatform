name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - run: dotnet restore AppPlatform.slnx
      - run: dotnet build AppPlatform.slnx --configuration Release --no-restore
      - run: dotnet test AppPlatform.slnx --configuration Release --no-build --logger trx

      - name: Install Azure CLI (for bicep linting)
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | bash

      - name: Lint bicep
        run: |
          az bicep install
          az bicep build --file infra/app.bicep --stdout > /dev/null
          az bicep build --file infra/shared.bicep --stdout > /dev/null

      - run: dotnet pack AppPlatform.slnx --configuration Release --no-build -o artifacts

      - name: Assert the Functions package ships no assembly
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Get-ChildItem artifacts/PS.AppPlatform.Functions.*.nupkg | Select-Object -First 1
          $entries = [IO.Compression.ZipFile]::OpenRead($pkg.FullName).Entries.FullName
          if ($entries -match '^lib/') { throw "Functions package contains lib/ - shims would be invisible to worker indexing" }
          if (-not ($entries -match '^endpoints/')) { throw "Functions package is missing endpoints/" }
          if (-not ($entries -match '^build/')) { throw "Functions package is missing build/*.targets" }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          retention-days: 14

