name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
            V="${V#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - run: |
          dotnet pack src/PS.AppPlatform/PS.AppPlatform.csproj --configuration Release -p:Version=${{ steps.v.outputs.version }} -o artifacts
          dotnet pack src/PS.AppPlatform.Functions/PS.AppPlatform.Functions.csproj --configuration Release -p:Version=${{ steps.v.outputs.version }} -o artifacts
          dotnet pack templates/PS.AppPlatform.Templates.csproj --configuration Release -p:Version=${{ steps.v.outputs.version }} -o artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://nuget.pkg.github.com/PatrickSchop/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate


      # The front-end libraries go to the same GitHub Packages, as @patrickschop/* (the scope of an
      # npm package on GitHub Packages must be the owning account). They are versioned in lockstep
      # with the NuGet packages.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@patrickschop'

      - name: Build and publish the npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.v.outputs.version }}"
          npm ci --prefix clients
          for p in app-client app-client-angular app-client-react; do
            npm pkg set version="$V" --prefix "clients/$p"
          done
          npm run build --prefix clients --workspace @patrickschop/app-client --workspace @patrickschop/app-client-angular --workspace @patrickschop/app-client-react
          # The Angular package is published from its ng-packagr output, the others from their folder.
          npm pkg set version="$V" "peerDependencies.@patrickschop/app-client=^$V" --prefix clients/app-client-angular/dist
          npm pkg set "peerDependencies.@patrickschop/app-client=^$V" --prefix clients/app-client-react
          npm publish clients/app-client
          npm publish clients/app-client-angular/dist
          npm publish clients/app-client-react
