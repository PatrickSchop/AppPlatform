name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
            V="${V#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - run: |
          dotnet pack src/Wisdi.AppPlatform/Wisdi.AppPlatform.csproj --configuration Release -p:Version=${{ steps.v.outputs.version }} -o artifacts
          dotnet pack src/Wisdi.AppPlatform.Functions/Wisdi.AppPlatform.Functions.csproj --configuration Release -p:Version=${{ steps.v.outputs.version }} -o artifacts
          dotnet pack templates/Wisdi.AppPlatform.Templates.csproj --configuration Release -p:Version=${{ steps.v.outputs.version }} -o artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://nuget.pkg.github.com/PatrickSchop/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
