<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        .note { border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 4px; }
        .note-title { font-weight: bold; }
        .note-body { margin-top: 4px; color: #555; }
        .note-wordcount { font-size: 0.9em; color: #999; margin-top: 4px; }
        form { margin: 20px 0; padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; }
        input, textarea, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; font-family: inherit; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .loading { display: none; margin-top: 12px; }
        .progress-bar { width: 100%; height: 20px; background: #f0f0f0; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .progress-fill { height: 100%; background: #28a745; transition: width 0.3s; }
        .error { color: #dc3545; margin-top: 8px; }
        .success { color: #28a745; margin-top: 8px; }
    </style>
</head>
<body>
    <h1 id="title">Sample App</h1>

    <h2>Add a Note</h2>
    <form>
        <input type="text" id="title" placeholder="Title" required>
        <textarea id="body" placeholder="Body" rows="4" required></textarea>
        <button type="button" onclick="createNote()">Add Note</button>
        <div id="createError" class="error"></div>
    </form>

    <h2>Notes</h2>
    <div id="notes"></div>

    <h2>Tasks</h2>
    <button type="button" onclick="startWordCount()">Count Words</button>
    <div id="taskStatus"></div>
    <div id="taskError" class="error"></div>

    <script>
        const apiRoot = '/api';

        async function loadConfig() {
            try {
                const resp = await fetch('/configuration.json');
                const config = await resp.json();
                document.getElementById('title').innerText = config.webApp?.title || 'Sample App';
            } catch (e) {
                console.error('Failed to load config:', e);
            }
        }

        async function loadNotes() {
            try {
                const resp = await fetch(`${apiRoot}/notes`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const notes = await resp.json();
                const container = document.getElementById('notes');
                container.innerHTML = notes.map(note => `
                    <div class="note">
                        <div class="note-title">${escapeHtml(note.title)}</div>
                        <div class="note-body">${escapeHtml(note.body)}</div>
                        ${note.wordCount !== null ? `<div class="note-wordcount">Word count: ${note.wordCount}</div>` : ''}
                    </div>
                `).join('') || '<p>No notes yet.</p>';
            } catch (e) {
                document.getElementById('notes').innerHTML = `<div class="error">Failed to load notes: ${e.message}</div>`;
            }
        }

        async function createNote() {
            const title = document.getElementById('title').value?.trim();
            const body = document.getElementById('body').value?.trim();
            if (!title || !body) {
                document.getElementById('createError').textContent = 'Title and body are required';
                return;
            }

            try {
                const resp = await fetch(`${apiRoot}/notes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, body, wordCount: null, createdUtc: new Date().toISOString() })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                document.getElementById('title').value = '';
                document.getElementById('body').value = '';
                document.getElementById('createError').textContent = '';
                await loadNotes();
            } catch (e) {
                document.getElementById('createError').textContent = `Error: ${e.message}`;
            }
        }

        async function startWordCount() {
            try {
                const resp = await fetch(`${apiRoot}/notes/wordcount`, { method: 'POST' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const { taskId } = await resp.json();
                pollTaskProgress(taskId);
            } catch (e) {
                document.getElementById('taskError').textContent = `Error: ${e.message}`;
            }
        }

        async function pollTaskProgress(taskId) {
            const statusDiv = document.getElementById('taskStatus');
            statusDiv.innerHTML = '<div class="loading" style="display:block">Running task...</div>';
            const pollInterval = setInterval(async () => {
                try {
                    const resp = await fetch(`${apiRoot}/tasks/notifications`);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const tasks = await resp.json();
                    const task = tasks.find(t => t.id === taskId);
                    if (!task) return;

                    const progress = task.progressPercent || 0;
                    statusDiv.innerHTML = `
                        <div class="loading" style="display:block">
                            <div>Progress: ${progress}%</div>
                            <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                        </div>
                    `;

                    if (task.status === 2 || task.status === 32) { // Completed or Failed
                        clearInterval(pollInterval);
                        statusDiv.innerHTML = task.status === 2 ? '<div class="success">Task complete!</div>' : '<div class="error">Task failed</div>';
                        await loadNotes();
                    }
                } catch (e) {
                    clearInterval(pollInterval);
                    statusDiv.innerHTML = `<div class="error">Error polling task: ${e.message}</div>`;
                }
            }, 1000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadConfig();
        loadNotes();
    </script>
</body>
</html>
